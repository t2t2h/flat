name: Build AgoraRecorder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/*.sdk $HOME/theos/sdks/
          ls $HOME/theos/sdks

      - name: Locate project and rebuild prefs folder
        run: |
          DIR=$(dirname "$(find . -name control -not -path './.git/*' | head -1)")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          cd "$DIR"
          if [ -f setup_prefs.sh ] && [ -f agorarecorderprefs_Makefile ]; then
            bash setup_prefs.sh
          fi
          ls -R .

      - name: Build .deb
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: AgoraRecorder-deb
          path: ${{ env.PROJECT_DIR }}/packages/*.deb
